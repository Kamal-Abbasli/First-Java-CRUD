<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Student Manager'">Student Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container narrow-container">
    <a class="back-link" th:href="@{/students}">← Back to students</a>
    <section class="panel form-panel">
        <p class="eyebrow">STUDENT RECORD</p>
        <h1 th:text="${pageTitle}">Add Student</h1>
        <p class="subtitle">Enter the student's details below.</p>

        <form th:action="${formAction}" th:object="${student}" method="post" class="student-form">
            <input type="hidden" th:field="*{id}">

            <div class="form-field">
                <label for="name">Full Name <span>*</span></label>
                <input id="name" type="text" th:field="*{name}" placeholder="e.g. Alex Johnson" required maxlength="80">
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>
            </div>

            <div class="form-field">
                <label for="email">Email Address <span>*</span></label>
                <input id="email" type="email" th:field="*{email}" placeholder="e.g. alex@example.com" required maxlength="120">
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
            </div>

            <div class="form-field">
                <label for="course">Course</label>
                <input id="course" type="text" th:field="*{course}" placeholder="e.g. Computer Science" maxlength="80">
                <p class="field-hint">Course is optional.</p>
                <p class="field-error" th:if="${#fields.hasErrors('course')}" th:errors="*{course}">Course error</p>
            </div>

            <div class="form-actions">
                <a class="button button-secondary" th:href="@{/students}">Cancel</a>
                <button class="button button-primary" type="submit">Save Student</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
